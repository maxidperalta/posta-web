<title>Gracias — Posta</title>
<meta name="description" content="Recibimos tu mensaje." />
<style>
  :root {
    --bg: #FAF6F1;
    --card: #FFFFFF;
    --line: #EDE0D4;
    --ink: #1C1008;
    --body: #5C4033;
    --mute: #9B8070;
    --acento: #C4622D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.65;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  a { color: var(--acento); }
  h1 { color: var(--ink); font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { color: var(--ink); font-size: 1.15rem; margin: 36px 0 10px; }
  .fecha { color: var(--mute); font-size: 0.9rem; margin-bottom: 28px; }
  .volver { display: inline-block; margin-bottom: 24px; font-weight: 600; text-decoration: none; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; margin: 20px 0;
  }
  ul { padding-left: 20px; }
  li { margin-bottom: 8px; }
  strong { color: var(--ink); }
  code {
    background: rgba(196,98,45,0.08); padding: 2px 6px;
    border-radius: 5px; font-size: 0.92em;
  }
</style>
<style>
  label { display:block; margin:16px 0 6px; color:var(--ink); font-weight:600; font-size:.95rem; }
  input, select, textarea {
    width:100%; padding:11px 13px; font:inherit; color:var(--body);
    background:var(--card); border:1px solid var(--line); border-radius:10px;
  }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--acento); outline-offset:1px; }
  textarea { min-height:130px; resize:vertical; }
  .ayuda { color:var(--mute); font-size:.85rem; margin:6px 0 0; }
  .enviar {
    margin-top:22px; width:100%; padding:14px; border:0; border-radius:12px;
    background:var(--acento); color:#fff; font:inherit; font-weight:700;
    font-size:1rem; cursor:pointer;
  }
  .enviar:hover { filter:brightness(1.07); }
  /* La trampa para robots. Fuera de la pantalla y fuera del recorrido del
     teclado: una persona no la ve ni la puede completar sin querer. */
  .nada { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .ok { font-size:3rem; margin:0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="volver" href="./index.html">← Volver a Posta</a>

  <p class="ok">✅</p>
  <h1>Recibimos tu mensaje</h1>
  <p>
    Te vamos a contestar al correo que dejaste. Si es algo urgente, escribinos
    directo a <a href="mailto:hola@postaservicios.com.ar">hola@postaservicios.com.ar</a>.
  </p>

  <div class="card">
    <h2>Mientras tanto</h2>
    <p>
      En la <a href="ayuda.html">página de ayuda</a> está cómo funciona Posta,
      tanto para quien contrata un servicio como para quien lo ofrece.
    </p>
  </div>
</div>
</body>
</html>
